spring.application.name=learnsprint

# ---- Database: MySQL from XAMPP. Start MySQL in the XAMPP Control Panel first.
# createDatabaseIfNotExist creates the schema learnsprint_db on the first run.
spring.datasource.url=jdbc:mysql://localhost:3306/learnsprint_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila
spring.datasource.username=root
spring.datasource.password=

# ---- JPA: the tables are created and updated from the entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- Web
server.port=8080

# ---- Sample data: inserted only while the student table is empty.
learnsprint.seed=true
